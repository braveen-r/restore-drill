backup:
  tool: restic
  repository: /path/to/repo
  password_env: RESTIC_PASSWORD

restore:
  destination: /tmp/restore-drill-sandbox
  snapshot: latest

checks:
  critical_paths:
    - etc/app.conf
    - data/shopkart.db
  sqlite_smoke_test:
    enabled: true
    path: data/shopkart.db
    table: users

scoring:
  max_restore_seconds: 60
  max_snapshot_age_hours: 24

notifications:
  discord_webhook_env: DISCORD_WEBHOOK
  alert_on: ["C", "D", "F"]
